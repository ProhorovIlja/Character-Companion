# Explicitly user-authorized, manually started APK compilation only.
# No push, pull_request, cron, workflow_run, or other automatic triggers.
name: Build Android APKs (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Compile GeckoView and WebView debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 37.0 platform and build tools
        shell: bash
        run: bash scripts/install-android37-sdk.sh

      - name: Verify pinned Gradle wrapper and build prerequisites
        shell: bash
        run: bash scripts/doctor.sh

      - name: Run repository Python regression tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build GeckoView and WebView debug APKs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-apk.sh gecko
          bash scripts/build-apk.sh legacy

      - name: Check APK signatures, package IDs, and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          build_tools="$sdk_root/build-tools/36.0.0"
          mkdir -p dist
          for flavor in gecko legacy; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            test -s "$apk"
            unzip -tqq "$apk"
            entries="$(unzip -Z -1 "$apk")"
            grep -Fxq 'AndroidManifest.xml' <<< "$entries"
            grep -Fxq 'classes.dex' <<< "$entries"
            "$build_tools/apksigner" verify --verbose "$apk"
            badging="$("$build_tools/aapt" dump badging "$apk")"
            grep -E "^package: name='dev[.]caicompanion[.]app' " <<< "$badging"
            cp -- "$apk" "dist/CharacterCompanion-$flavor-debug.apk"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          {
            printf 'COMMIT=%s\n' "$GITHUB_SHA"
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'TRIGGER=workflow_dispatch_ONLY\n'
            printf 'ANDROID_COMPILE_SDK=37\n'
            printf 'BUILD_TYPE=DEBUG_NOT_PRODUCTION\n'
            printf 'DEVICE_TESTED=NO\n'
            printf 'APK_SIGNATURE=VERIFIED_DEBUG_KEY\n'
          } > dist/BUILD_INFO.txt

      - name: Upload both debug APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: CharacterCompanion-Android-debug-APKs
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
