# Existing explicitly authorized manual build only. No automatic triggers.
name: Build Character Companion APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Compile single ARM64 APK with both embedded engines
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this revision
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 37.2 platform and build tools
        shell: bash
        run: bash scripts/install-android37-sdk.sh gecko
      - name: Verify pinned Gradle wrapper and build prerequisites
        shell: bash
        run: bash scripts/doctor.sh gecko
      - name: Run repository Python regression tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify combined APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-apk.sh gecko
          bash scripts/verify-debug-apk.sh gecko
      - name: Collect the single verified APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/CharacterCompanion-legacy-debug.apk
          mv dist/CharacterCompanion-gecko-debug.apk dist/CharacterCompanion-Android-debug.apk
          (cd dist && sha256sum CharacterCompanion-Android-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          {
            printf 'COMMIT=%s\n' "$GITHUB_SHA"
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'TRIGGER=workflow_dispatch_ONLY\n'
            printf 'ANDROID_COMPILE_SDK_GECKO=37.2\n'
            printf 'DISTRIBUTION=ONE_ARM64_APK\nRENDERERS=GECKOVIEW_WEBVIEW_EXTERNAL_BROWSER\n'
            printf 'BUILD_TYPE=DEBUG_NOT_PRODUCTION\nDEVICE_TESTED=NO\n'
            printf 'APK_SIGNATURE=VERIFIED_DEBUG_KEY\n'
          } > dist/BUILD_INFO.txt
      - name: Upload verified debug APK and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CharacterCompanion-Android-debug-APK
          path: |
            dist/CharacterCompanion-Android-debug.apk
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
            dist/native-audit-gecko.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
